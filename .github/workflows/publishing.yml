name: Private publishing scripts

on:
  pull_request:
    paths:
      - "tools/publishing/**"
      - ".github/workflows/publishing.yml"
  push:
    branches: [main]
    paths:
      - "tools/publishing/**"
      - ".github/workflows/publishing.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check shell syntax
        run: |
          for script in tools/publishing/*.sh tools/publishing/lab-publish-route; do
            bash -n "$script"
          done
      - name: Test isolated publishing contracts
        run: python3 -B -m unittest discover -s tools/publishing/tests -v
