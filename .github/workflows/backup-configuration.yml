name: Backup configuration

on:
  pull_request:
    paths:
      - "devices/remote-lab/backup-tools/**"
      - ".github/workflows/backup-configuration.yml"
  push:
    branches: [main]
    paths:
      - "devices/remote-lab/backup-tools/**"
      - ".github/workflows/backup-configuration.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check installer syntax
        run: bash -n devices/remote-lab/backup-tools/install-home.sh
      - name: Test private address migration
        run: python3 -B -m unittest discover -s devices/remote-lab/backup-tools -p 'test_*.py' -v
